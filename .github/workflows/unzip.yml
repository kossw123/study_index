name: Auto Unzip

on:
  push:
    paths:
      - 'uploads/**.zip' # uploads 폴더 안에 zip 파일이 올라오면 실행

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 깃허브에 압축 푼 파일을 다시 저장할 수 있는 권한 고지
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          # uploads 폴더 내의 zip 파일을 찾아 레포지토리 루트에 압축 해제
          unzip -o uploads/*.zip -d ./
          # 압축 해제 후 원본 zip 파일은 자동 삭제 (선택 사항)
          rm uploads/*.zip

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # 변경사항이 있을 때만 커밋 및 푸시 수행
          git diff-index --quiet HEAD || (git commit -m "Auto-unzip files" && git push)
